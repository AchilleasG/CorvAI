services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    volumes:
      - .:/app
      - codex-data:/root/.codex
      - coding-data:/var/lib/corv-coding
    ports:
      - "8004:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - CORV_CODING_DIR=/var/lib/corv-coding
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_SERVICE_ACCOUNT_JSON=${FCM_SERVICE_ACCOUNT_JSON:-}
      - FCM_SERVICE_ACCOUNT_FILE=${FCM_SERVICE_ACCOUNT_FILE:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://web:8000
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - /app/node_modules
    depends_on:
      - web

  celery-worker:
    build: .
    command: >-
      celery -A CorvAI worker -l info
      --concurrency=2
      --prefetch-multiplier=1
      --max-tasks-per-child=20
      --max-memory-per-child=550000
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_SERVICE_ACCOUNT_JSON=${FCM_SERVICE_ACCOUNT_JSON:-}
      - FCM_SERVICE_ACCOUNT_FILE=${FCM_SERVICE_ACCOUNT_FILE:-}
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A CorvAI beat -l info
    restart: unless-stopped
    init: true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    restart: unless-stopped
    init: true
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    ports:
      - "6379:6379"

volumes:
  codex-data:
  coding-data:
